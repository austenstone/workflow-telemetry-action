name: "Workflow Telemetry JSON Collector"
description: "Collect CPU, memory, network, and disk telemetry from a GitHub Actions job as JSON"
author: "Austen Stone"
inputs:
  mode:
    description: "Collector mode: start or export"
    default: start
    required: false
  metric_frequency:
    description: "Metric collection frequency in seconds"
    default: "1"
    required: false
  output_path:
    description: "Path to write telemetry JSON in export mode"
    default: telemetry.json
    required: false
  server_port:
    description: "Local collector HTTP server port"
    default: "7777"
    required: false
outputs:
  telemetry_path:
    description: "Path to the exported telemetry JSON"
  sample_count:
    description: "Number of telemetry samples exported"
runs:
  using: "node24"
  main: dist/index.js
branding:
  icon: "activity"
  color: "yellow"
