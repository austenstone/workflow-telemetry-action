name: "Workflow Telemetry JSON Collector"
description: "Collect CPU, memory, network, and disk telemetry from a GitHub Actions job as JSON"
author: "Austen Stone"
inputs:
  mode:
    description: "Collector mode: start or export"
    default: start
    required: false
  metric_frequency:
    description: "Metric collection frequency in seconds. Use 0 to sample continuously, starting the next getDynamicData call as soon as the previous one completes."
    default: "1"
    required: false
  output_path:
    description: "Path to write telemetry JSON in export mode"
    default: telemetry.json
    required: false
  server_port:
    description: "Local collector HTTP server port"
    default: "7777"
    required: false
  github_token:
    description: "Token used to read workflow job metadata and step traces (needs actions: read). Only used in export mode."
    default: ${{ github.token }}
    required: false
  contexts:
    description: "JSON blob of workflow contexts to capture (github, strategy, matrix, needs, inputs). A JS action can't read these from env, so pass them in from the workflow using toJson, e.g. contexts: the toJson of the github context. Captured verbatim (may contain secrets). Only used in export mode."
    default: ""
    required: false
  upload_artifact:
    description: "Automatically export telemetry and upload it as an artifact in the post step. On by default so a single start step needs no export/upload-artifact steps. Set to false to drive export yourself with mode=export."
    default: "true"
    required: false
  artifact_name:
    description: "Name of the telemetry artifact uploaded by the post step when upload_artifact is true."
    default: telemetry
    required: false
  artifact_retention_days:
    description: "Retention period (days) for the uploaded telemetry artifact. Empty uses the repository default."
    default: ""
    required: false
  artifact_if_no_files_found:
    description: "Behavior when no telemetry file is found at upload time: warn, error, or ignore."
    default: warn
    required: false
outputs:
  telemetry_path:
    description: "Path to the exported telemetry JSON (time-series, summary, job)"
  system_path:
    description: "Path to the exported system info JSON (runner identity, env, static host facts)"
  contexts_path:
    description: "Path to the exported workflow contexts JSON. Empty when no contexts input was provided."
  sample_count:
    description: "Number of telemetry samples exported"
  job_id:
    description: "Numeric API id of the workflow job the telemetry was collected from"
runs:
  using: "node24"
  main: dist/index.js
  post: dist/index.js
  post-if: always()
branding:
  icon: "activity"
  color: "yellow"
